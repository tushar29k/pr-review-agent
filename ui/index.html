<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>pr-review-agent — demo</title>
<style>
:root{--bg:#0B1424;--bg2:#0E1A2E;--card:#081020;--line:#182742;--cyan:#22D3EE;--teal:#2DD4BF;--pink:#F472B6;--gold:#F4A259;--text:#E6EDF3;--muted:#8B98A9;--red:#FF6B6B}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.6;padding:2rem 1.2rem;max-width:900px;margin:0 auto}
header{display:flex;align-items:center;gap:.8rem;margin-bottom:.4rem}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--teal);box-shadow:0 0 10px var(--teal)}
h1{font-size:1.4rem}h1 span{color:var(--cyan)}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:1.2rem}

/* tabs */
.tabs{display:flex;gap:.4rem;margin-bottom:1.4rem;border-bottom:1px solid var(--line)}
.tab{background:none;border:none;color:var(--muted);font-size:.95rem;font-weight:600;padding:.7rem 1.1rem;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.tabpanel{display:none}
.tabpanel.active{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

input[type=text]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:.8rem .9rem;font-size:.9rem}
input[type=text]:focus{outline:none;border-color:var(--cyan)}
textarea{width:100%;min-height:220px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:.9rem;font-size:.82rem;font-family:ui-monospace,Menlo,monospace;resize:vertical}
textarea:focus{outline:none;border-color:var(--cyan)}
.row{display:flex;gap:.8rem;margin:1rem 0;flex-wrap:wrap;align-items:center}
button.go{background:linear-gradient(90deg,var(--cyan),var(--teal));border:none;color:#06222b;font-weight:700;padding:.7rem 1.6rem;border-radius:999px;cursor:pointer;font-size:.95rem}
button.go:disabled{opacity:.5;cursor:wait}
button.link{background:transparent;border:1px solid var(--line);color:var(--muted);padding:.7rem 1.2rem;border-radius:999px;cursor:pointer;font-size:.9rem}
button.link:hover{color:var(--text);border-color:var(--cyan)}
.or{color:var(--muted);font-size:.85rem;margin:1.2rem 0 .6rem}
.finder{display:flex;gap:.6rem}
.finder input{flex:1}
.finder button{flex:none}

/* pr list from username search */
.prlist{list-style:none;display:flex;flex-direction:column;gap:.5rem;margin:1rem 0}
.prlist button{width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:.7rem .9rem;cursor:pointer;font-size:.9rem}
.prlist button:hover{border-color:var(--cyan)}
.prlist .repo{color:var(--muted);font-size:.8rem}
.prlist .num{color:var(--cyan);font-weight:700}
.prlist .state{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:.1rem .6rem;color:var(--muted);margin-left:.5rem}

/* result header card */
.prhead{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.3rem;margin:1.2rem 0;display:flex;gap:1rem;align-items:flex-start}
.prhead img{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);flex:none}
.prhead .meta{flex:1;min-width:0}
.prhead .repo{color:var(--muted);font-size:.82rem}
.prhead .repo a{color:var(--cyan);text-decoration:none}
.prhead h2{font-size:1.1rem;line-height:1.4;margin:.2rem 0 .6rem}
.diffstats{display:flex;gap:.5rem;flex-wrap:wrap}
.dstat{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:.15rem .75rem;color:var(--muted)}
.dstat.add{color:var(--teal);border-color:var(--teal)}
.dstat.del{color:var(--red);border-color:var(--red)}

/* severity summary */
.chips{display:flex;gap:.6rem;margin:1.2rem 0;flex-wrap:wrap;align-items:center}
.chip{font-size:.82rem;border:1px solid var(--line);border-radius:999px;padding:.3rem .9rem;color:var(--muted)}
.chip.crit{color:var(--pink);border-color:var(--pink)}
.chip.warn{color:var(--gold);border-color:var(--gold)}
.chip.info{color:var(--cyan);border-color:var(--cyan)}
.copybtn{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:.35rem 1rem;cursor:pointer;font-size:.82rem}
.copybtn:hover{color:var(--text);border-color:var(--cyan)}

/* finding cards */
.findings{list-style:none;display:flex;flex-direction:column;gap:.7rem}
.finding{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:10px;padding:.85rem 1rem;animation:fade .4s ease}
.finding.critical{border-left-color:var(--red)}
.finding.warning{border-left-color:var(--gold)}
.finding.info{border-left-color:var(--cyan)}
.finding .top{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.35rem}
.sev{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;border-radius:5px;padding:.15rem .55rem}
.sev.critical{background:rgba(255,107,107,.12);color:var(--red)}
.sev.warning{background:rgba(244,162,89,.12);color:var(--gold)}
.sev.info{background:rgba(34,211,238,.12);color:var(--cyan)}
.where{font-family:ui-monospace,Menlo,monospace;font-size:.78rem;color:var(--cyan);background:#00000055;border:1px solid var(--line);border-radius:5px;padding:.1rem .5rem}
.checkname{font-size:.78rem;color:var(--muted)}
.finding p{font-size:.9rem}
.clean{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:1.4rem;color:var(--muted);font-size:.9rem}
.err{background:rgba(255,107,107,.08);border:1px solid var(--red);border-radius:10px;padding:.9rem 1.1rem;color:var(--red);margin-top:1rem;font-size:.9rem}
.loading{color:var(--muted);font-size:.9rem;margin-top:1rem}
.hidden{display:none}
@media(max-width:600px){.prhead img{width:38px;height:38px}}
</style>
</head>
<body>
<header><span class="dot" id="health"></span><h1>pr-review-agent <span>demo</span></h1></header>
<p class="sub">Review any GitHub PR from its link — or paste a unified diff. Deterministic checks catch the obvious stuff; the mock reviewer adds commentary.</p>

<div class="tabs">
  <button class="tab active" onclick="showTab('pr')">GitHub PR</button>
  <button class="tab" onclick="showTab('diff')">Paste diff</button>
</div>

<!-- ============ PR tab ============ -->
<div class="tabpanel active" id="tab-pr">
  <input type="text" id="prurl" placeholder="https://github.com/owner/repo/pull/123" />
  <div class="row">
    <button class="go" id="prbtn" onclick="reviewPR()">Review PR →</button>
  </div>
  <p class="or">or find your PRs</p>
  <div class="finder">
    <input type="text" id="ghuser" placeholder="your GitHub username" />
    <button class="link" id="findbtn" onclick="findPRs()">Find PRs</button>
  </div>
  <ul class="prlist" id="prlist"></ul>
  <div id="out"></div>
</div>

<!-- ============ diff tab ============ -->
<div class="tabpanel" id="tab-diff">
  <textarea id="diff" placeholder="diff --git a/app.py b/app.py …"></textarea>
  <div class="row">
    <button class="go" id="revbtn" onclick="reviewDiff()">Review diff →</button>
    <button class="link" onclick="sample()">Load sample diff</button>
  </div>
  <div id="outdiff"></div>
</div>

<script>
var SAMPLE = "diff --git a/payments.py b/payments.py\n--- a/payments.py\n+++ b/payments.py\n@@ -20,6 +20,9 @@\n def charge(user, amount):\n+    api_key = \"sk-live-9f8e7d6c5b4a39482716a1b2\"\n+    print(\"charging\", user)\n+    # TODO: handle retries properly\n     return gateway.charge(api_key, amount)\n";
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function sample(){document.getElementById('diff').value=SAMPLE}
fetch('/health').then(function(){document.getElementById('health').classList.add('ok')}).catch(function(){});

function showTab(which){
  var tabs=document.querySelectorAll('.tab'), panels=document.querySelectorAll('.tabpanel');
  tabs[0].classList.toggle('active',which==='pr'); tabs[1].classList.toggle('active',which==='diff');
  panels[0].classList.toggle('active',which==='pr'); panels[1].classList.toggle('active',which==='diff');
}

function apiError(r){ /* surface our friendly backend detail, not raw status */
  return r.json().then(function(j){
    throw new Error(j.detail || ('Request failed ('+r.status+')'));
  }).catch(function(e){
    if(e instanceof Error && e.message.indexOf('Request failed')!==0 && e.message!=='Unexpected end of JSON input'){throw e}
    throw new Error('Request failed ('+r.status+')');
  });
}

/* ---------- finding cards ---------- */
function renderResult(out, d){
  var sevCount={critical:0,warning:0,info:0};
  d.findings.forEach(function(f){sevCount[f.severity]=(sevCount[f.severity]||0)+1});
  var chips='<div class="chips"><span class="chip">'+d.finding_count+' findings</span>'+
    (sevCount.critical?'<span class="chip crit">'+sevCount.critical+' critical</span>':'')+
    (sevCount.warning?'<span class="chip warn">'+sevCount.warning+' warning</span>':'')+
    (sevCount.info?'<span class="chip info">'+sevCount.info+' info</span>':'')+
    '<button class="copybtn" onclick="copyMD(this)">Copy markdown</button></div>';

  var body;
  if(!d.findings.length){
    body='<div class="clean">No issues found. Either it\u2019s clean or I\u2019m not looking hard enough — give the logic a human skim anyway.</div>';
  } else {
    body='<ul class="findings">'+d.findings.map(function(f){
      return '<li class="finding '+f.severity+'"><div class="top">'+
        '<span class="sev '+f.severity+'">'+esc(f.severity)+'</span>'+
        '<span class="where">'+esc(f.file)+(f.line?':'+f.line:'')+'</span>'+
        '<span class="checkname">'+esc(f.check)+'</span></div>'+
        '<p>'+esc(f.message)+'</p></li>';
    }).join('')+'</ul>';
  }
  out.innerHTML=chips+'<div class="review">'+body+'</div>';
  out.querySelector('.copybtn').setAttribute('data-md', d.markdown);
}

function copyMD(btn){
  var done=function(){btn.textContent='Copied ✓';setTimeout(function(){btn.textContent='Copy markdown'},1500)};
  var md=btn.getAttribute('data-md')||'';
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(md).then(done,done)}
  else{var t=document.createElement('textarea');t.value=md;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(t);done()}
}

/* ---------- PR review flow ---------- */
function prHeader(p){
  return '<div class="prhead">'+
    (p.author_avatar?'<img src="'+esc(p.author_avatar)+'" alt="" />':'')+
    '<div class="meta"><div class="repo"><a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.repo)+'</a> · #'+p.number+' · '+esc(p.state)+'</div>'+
    '<h2>'+esc(p.title)+'</h2>'+
    '<div class="diffstats">'+
    '<span class="dstat">'+p.changed_files+' files changed</span>'+
    '<span class="dstat add">+'+p.additions+'</span>'+
    '<span class="dstat del">−'+p.deletions+'</span>'+
    '<span class="dstat">by '+esc(p.author)+'</span>'+
    '</div></div></div>';
}

function reviewPR(url){
  url=(url||document.getElementById('prurl').value).trim();
  if(!url){return}
  document.getElementById('prurl').value=url;
  var btn=document.getElementById('prbtn');btn.disabled=true;btn.textContent='Fetching PR…';
  var out=document.getElementById('out');out.innerHTML='<p class="loading">Fetching the diff from GitHub, then reviewing…</p>';
  fetch('/review-pr',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pr_url:url})})
  .then(function(r){if(!r.ok){return apiError(r)}return r.json()})
  .then(function(d){
    out.innerHTML=prHeader(d.pr);
    var res=document.createElement('div');out.appendChild(res);
    renderResult(res,d);
  }).catch(function(e){out.innerHTML='<div class="err">'+esc(e.message)+'</div>'})
  .finally(function(){btn.disabled=false;btn.textContent='Review PR →'});
}

function findPRs(){
  var user=document.getElementById('ghuser').value.trim();
  if(!user){return}
  var list=document.getElementById('prlist');list.innerHTML='<li class="loading">Searching GitHub…</li>';
  var btn=document.getElementById('findbtn');btn.disabled=true;
  fetch('https://api.github.com/search/issues?q='+encodeURIComponent('type:pr author:'+user)+'&per_page=8&sort=updated&order=desc')
  .then(function(r){
    if(r.status===403){throw new Error('GitHub rate limit hit — try again in a few minutes')}
    if(r.status===422){throw new Error('No public PRs found for that username')}
    if(!r.ok){throw new Error('GitHub search failed ('+r.status+')')}
    return r.json();
  }).then(function(j){
    if(!j.items||!j.items.length){list.innerHTML='<li class="loading">No public PRs found for “'+esc(user)+'”.</li>';return}
    list.innerHTML=j.items.map(function(it){
      var parts=it.html_url.split('/'); /* …/owner/repo/pull/123 */
      var repo=parts[3]+'/'+parts[4], num=parts[6];
      return '<li><button onclick="reviewPR(\''+esc(it.html_url)+'\')">'+
        '<span class="repo">'+esc(repo)+'</span> <span class="num">#'+num+'</span>'+
        '<span class="state">'+esc(it.state)+'</span><br/>'+esc(it.title)+'</button></li>';
    }).join('');
  }).catch(function(e){list.innerHTML='<li class="err">'+esc(e.message)+'</li>'})
  .finally(function(){btn.disabled=false});
}

/* ---------- raw diff flow (unchanged) ---------- */
function reviewDiff(){
  var diff=document.getElementById('diff').value.trim();
  if(!diff){return}
  var btn=document.getElementById('revbtn');btn.disabled=true;btn.textContent='Reviewing…';
  var out=document.getElementById('outdiff');out.innerHTML='';
  fetch('/review',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({diff:diff})})
  .then(function(r){if(!r.ok){return apiError(r)}return r.json()})
  .then(function(d){renderResult(out,d)})
  .catch(function(e){out.innerHTML='<div class="err">'+esc(e.message)+'</div>'})
  .finally(function(){btn.disabled=false;btn.textContent='Review diff →'});
}
</script>
</body>
</html>
